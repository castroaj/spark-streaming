plugins {
    id 'java-library'
    id 'com.gradleup.shadow'
    id 'checkstyle'
    id 'com.github.spotbugs'
}

group = 'com.github.castroaj'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()

}

// ---------------------------------------------------------------------------
// Java toolchain
// ---------------------------------------------------------------------------

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'

// ---------------------------------------------------------------------------
// Dependencies (boilerplate only — connector deps added per module)
// ---------------------------------------------------------------------------

dependencies {
    // Spark — provided by cluster at runtime
    compileOnly "org.apache.spark:spark-core_2.12:3.5.8"
    compileOnly "org.apache.spark:spark-sql_2.12:3.5.8"

    // Logging facade — implementation provided by consuming Spark job
    compileOnly 'org.slf4j:slf4j-api:2.0.13'

    // Jakarta Bean Validation — API + Hibernate Validator provider
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
    implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'

    // Kafka connector
    implementation "org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.8"

    // Lombok — annotation processor only; not included in the thin JAR
    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'
    testCompileOnly 'org.projectlombok:lombok:1.18.36'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.36'

    // Spark on test classpath for Mockito mocking of SparkSession/DataStreamReader etc.
    testImplementation "org.apache.spark:spark-core_2.12:3.5.8"
    testImplementation "org.apache.spark:spark-sql_2.12:3.5.8"

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-kafka'
    testImplementation "org.mockito:mockito-core:5.12.0"
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.13'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ---------------------------------------------------------------------------
// Integration test source set
// ---------------------------------------------------------------------------

sourceSets {
    integrationTest {
        java {
            srcDirs = ['src/integrationTest/java']
        }
        resources {
            srcDirs = ['src/integrationTest/resources']
        }
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    
    // Integration test Spark + Delta deps (declared after sourceSets to ensure config exists)
    integrationTestImplementation "org.apache.spark:spark-core_2.12:3.5.8"
    integrationTestImplementation "org.apache.spark:spark-sql_2.12:3.5.8"
    integrationTestImplementation "io.delta:delta-spark_2.12:3.2.1"
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests against a real Spark session.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter test
    // Java 17 module system: Spark 3.x accesses internal JDK APIs that require explicit opens
    jvmArgs(
        '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
        '--add-opens=java.base/java.nio=ALL-UNNAMED',
        '--add-opens=java.base/java.lang=ALL-UNNAMED',
        '--add-opens=java.base/java.util=ALL-UNNAMED',
        '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED'
    )
}

// ---------------------------------------------------------------------------
// Test task — unit tests only; integrationTest excluded per STANDARDS.md
// ---------------------------------------------------------------------------

test {
    useJUnitPlatform()
}

// check = test + static analysis; integrationTest is NOT part of check
check.dependsOn test

// ---------------------------------------------------------------------------
// Shadow JAR (uber/fat JAR for standalone spark-submit use)
// ---------------------------------------------------------------------------

shadowJar {
    archiveClassifier = 'all'
    relocate 'com.google', 'shadow.com.google'
    relocate 'org.apache.commons', 'shadow.org.apache.commons'
    relocate 'okhttp3', 'shadow.okhttp3'
}

// ---------------------------------------------------------------------------
// Checkstyle
// ---------------------------------------------------------------------------

checkstyle {
    toolVersion = '10.17.0'
    configFile = file("${rootDir}/checkstyle/checkstyle.xml")
    ignoreFailures = false
    maxWarnings = 0
}

// ---------------------------------------------------------------------------
// SpotBugs
// ---------------------------------------------------------------------------

spotbugs {
    ignoreFailures = false
    showProgress = true
}

spotbugsMain {
    reports {
        html {
            required = true
            outputLocation = layout.buildDirectory.file('reports/spotbugs/main.html')
        }
    }
}

spotbugsTest {
    reports {
        html {
            required = true
            outputLocation = layout.buildDirectory.file('reports/spotbugs/test.html')
        }
    }
}

spotbugsIntegrationTest {
    reports {
        html {
            required = true
            outputLocation = layout.buildDirectory.file('reports/spotbugs/integrationTest.html')
        }
    }
}

services:
  # S3 Compatible Storage
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: lakehouse-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - lakehouse-net

  # Setup Bucket
  # minio-setup:
  #   image: minio/mc:RELEASE.2024-01-13T22-51-38Z
  #   depends_on:
  #     - minio
  #   entrypoint: >
  #     /bin/sh -c "
  #     until mc alias set local http://minio:9000 minioadmin minioadmin; do echo '...waiting for minio...'; sleep 1; done;
  #     mc mb --ignore-existing local/warehouse;
  #     mc mb --ignore-existing local/landing;
  #     exit 0;
  #     "
  #   networks:
  #     - lakehouse-net

  # Compute Engine (Spark + Jupyter)
  spark:
    build: .
    container_name: lakehouse-spark
    environment:
      - JUPYTER_ENABLE_LAB=yes
    ports:
      - "8888:8888" # Jupyter Lab
      - "4040:4040" # Spark UI
    volumes:
      - ./src:/home/jovyan/work
    networks:
      - lakehouse-net

volumes:
  minio_data:

networks:
  lakehouse-net: